name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pack structure
        run: bash scripts/validate-pack.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test pack scripts
        run: node --test packs/*/skills/*/scripts/*.test.mjs
