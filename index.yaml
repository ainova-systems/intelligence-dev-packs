# Registry index for this repository.
#
# This repo holds several Intelligence Packages, so the package names are not
# repository names and cannot be resolved by convention. The Intelligence CLI
# reads this file from the repository root to map them to their sources:
#
#   intelligence registry add https://github.com/ainova-systems/intelligence-dev-packs.git
#   intelligence package search
#   intelligence package add @ainova-systems/core
#
# A name resolves only through a registry the project has explicitly trusted:
# there is no built-in catalog and no name-to-repository guessing, so adding
# this registry is what makes the names below installable. Versions live in
# this repository's git tags (x.y.z, optional `v`), not in this file: a
# project's range resolves against them and pins the resolved tag and commit
# in its intelligence.lock.
packages:
  "@ainova-systems/core":
    url: "https://github.com/ainova-systems/intelligence-dev-packs.git"
    path: "packs/core"
    description: "Universal engineering discipline and git/PR/release mechanics: verification gates, rollback safety, context engineering, code review, releases."
  "@ainova-systems/spec":
    url: "https://github.com/ainova-systems/intelligence-dev-packs.git"
    path: "packs/spec"
    description: "Opt-in spec-driven lifecycle: intake, plan, adversarial validation, parallel execution, docs upkeep, decision records. Depends on core."
  "@ainova-systems/operator":
    url: "https://github.com/ainova-systems/intelligence-dev-packs.git"
    path: "packs/operator"
    description: "Phase skills the Operator runtime runs: intake, plan, implement, review, verify, merge and clarify, each also runnable by hand, plus the forge contract and its GitHub implementation. Core recommended, optional via profile keys."
